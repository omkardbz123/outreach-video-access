<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Outreach videos access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --card-hover: #1a243d;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f3f4f6;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --input-bg: #0f172a;
      --tag-bg: rgba(59, 130, 246, 0.15);
      --tag-text: #60a5fa;
      --modal-bg: #131b2e;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-hover: #f1f5f9;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --input-bg: #f8fafc;
      --tag-bg: #eff6ff;
      --tag-text: #2563eb;
      --modal-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Top Navigation Bar */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      padding: 14px 0 0;
    }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    /* Header */
    header {
      padding: 16px 0 24px;
      text-align: center;
    }

    header h1 {
      font-size: clamp(1.6rem, 5vw, 2.3rem);
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #3b82f6 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: clamp(0.85rem, 3.5vw, 0.95rem);
      padding: 0 8px;
    }

    /* Toolbar / Controls */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .search-wrapper input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px 12px 42px;
      color: var(--text-main);
      font-size: 16px; /* Prevents auto-zoom on iOS */
      outline: none;
    }

    .search-wrapper input:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    /* Video Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .video-card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .video-card:active {
      transform: scale(0.98);
    }

    .thumbnail-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .thumbnail-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      background: rgba(37, 99, 235, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.35);
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .tags-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .event-tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      max-width: 65%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .size-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .video-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      margin-top: auto;
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Responsive Mobile Video Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(5px);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--modal-bg);
      border-radius: 14px;
      width: 100%;
      max-width: 850px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h3 {
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
      color: var(--text-main);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.6rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }

    .player-frame-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .player-frame-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* States & Spinners */
    .state-message {
      text-align: center;
      padding: 60px 16px;
      color: var(--text-muted);
      font-size: 0.95rem;
      grid-column: 1 / -1;
    }

    .spinner {
      border: 3px solid rgba(120, 120, 120, 0.2);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Desktop Adjustments */
    @media (min-width: 640px) {
      .toolbar {
        flex-direction: row;
        align-items: center;
      }
      .controls {
        width: auto;
        display: flex;
      }
      select {
        width: auto;
      }
      .grid {
        gap: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container top-bar">
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <span id="themeIcon">☀️</span>
      <span id="themeText">Light Mode</span>
    </button>
  </div>

  <header>
    <div class="container">
      <h1>Outreach videos access</h1>
      <p>Browse, filter, and stream all outreach event recordings</p>
    </div>
  </header>

  <main class="container">
    <!-- Controls -->
    <div class="toolbar">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search title or event..." />
      </div>

      <div class="controls">
        <select id="eventFilter">
          <option value="ALL">All Events</option>
        </select>

        <select id="sortBy">
          <option value="newest">Date: Newest</option>
          <option value="oldest">Date: Oldest</option>
          <option value="titleAsc">Name: A-Z</option>
          <option value="titleDesc">Name: Z-A</option>
        </select>
      </div>
    </div>

    <!-- Video Grid -->
    <div id="videoGrid" class="grid">
      <div class="state-message">
        <div class="spinner"></div>
        Loading outreach videos...
      </div>
    </div>
  </main>

  <!-- Inbuilt Player Modal -->
  <div id="playerModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalVideoTitle">Playing Video</h3>
        <button class="close-btn" id="closeModal">&times;</button>
      </div>
      <div class="player-frame-wrapper">
        <iframe id="videoIframe" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwh1m5WizywMP50Aa3ZvPy6Xj42XUiUEiB4j2d8Zape5NcwuITGSieHgAKL1s92tUDc/exec";

    let allVideos = [];

    // Theme Management
    const htmlEl = document.documentElement;
    const themeBtn = document.getElementById("themeToggle");
    const themeIcon = document.getElementById("themeIcon");
    const themeText = document.getElementById("themeText");

    function applyTheme(theme) {
      htmlEl.setAttribute("data-theme", theme);
      localStorage.setItem("theme", theme);
      if (theme === "light") {
        themeIcon.textContent = "🌙";
        themeText.textContent = "Dark Mode";
      } else {
        themeIcon.textContent = "☀️";
        themeText.textContent = "Light Mode";
      }
    }

    const savedTheme = localStorage.getItem("theme") || "dark";
    applyTheme(savedTheme);

    themeBtn.addEventListener("click", () => {
      const current = htmlEl.getAttribute("data-theme");
      applyTheme(current === "dark" ? "light" : "dark");
    });

    // Fetch and Display Videos
    async function loadVideos() {
      const grid = document.getElementById("videoGrid");
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const json = await res.json();

        if (json.status === "success" && json.data.length > 0) {
          allVideos = json.data;
          populateEventFilter(allVideos);
          renderVideos(allVideos);
        } else {
          grid.innerHTML = `<div class="state-message">No videos found in Drive.</div>`;
        }
      } catch (err) {
        console.error(err);
        grid.innerHTML = `<div class="state-message">Failed to load videos. Check Apps Script permissions.</div>`;
      }
    }

    function populateEventFilter(videos) {
      const filterSelect = document.getElementById("eventFilter");
      const events = [...new Set(videos.map(v => v.event))];
      
      events.forEach(evt => {
        if (evt && evt !== "General") {
          const opt = document.createElement("option");
          opt.value = evt;
          opt.textContent = evt;
          filterSelect.appendChild(opt);
        }
      });
    }

    function renderVideos(videos) {
      const grid = document.getElementById("videoGrid");
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      const selectedEvent = document.getElementById("eventFilter").value;
      const sortBy = document.getElementById("sortBy").value;

      let filtered = videos.filter(v => {
        const matchesQuery = v.name.toLowerCase().includes(query) || (v.event && v.event.toLowerCase().includes(query));
        const matchesEvent = selectedEvent === "ALL" || v.event === selectedEvent;
        return matchesQuery && matchesEvent;
      });

      filtered.sort((a, b) => {
        if (sortBy === "newest") return new Date(b.date) - new Date(a.date);
        if (sortBy === "oldest") return new Date(a.date) - new Date(b.date);
        if (sortBy === "titleAsc") return a.name.localeCompare(b.name);
        if (sortBy === "titleDesc") return b.name.localeCompare(a.name);
        return 0;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="state-message">No matching videos found.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="video-card" onclick="openPlayer('${item.previewUrl}', '${escapeHtml(item.name)}')">
          <div class="thumbnail-container">
            <img src="${item.thumbnail}" alt="${escapeHtml(item.name)}" onerror="this.src='https://placehold.co/640x360/131b2e/94a3b8?text=Video'" />
            <div class="play-badge">▶</div>
          </div>
          <div class="card-body">
            <div class="tags-row">
              <span class="event-tag">${escapeHtml(item.event || 'General')}</span>
              <span class="size-tag">${item.size}</span>
            </div>
            <h2 class="video-title">${escapeHtml(item.name)}</h2>
            <div class="card-footer">
              <span>📅</span>
              <span>${item.formattedDate}</span>
            </div>
          </div>
        </div>
      `).join("");
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Modal Player Controls
    function openPlayer(previewUrl, title) {
      document.getElementById("modalVideoTitle").textContent = title;
      document.getElementById("videoIframe").src = previewUrl;
      document.getElementById("playerModal").classList.add("active");
      document.body.style.overflow = "hidden"; // Prevent page scroll behind modal
    }

    function closePlayer() {
      document.getElementById("videoIframe").src = "";
      document.getElementById("playerModal").classList.remove("active");
      document.body.style.overflow = "";
    }

    document.getElementById("closeModal").addEventListener("click", closePlayer);
    document.getElementById("playerModal").addEventListener("click", (e) => {
      if (e.target.id === "playerModal") closePlayer();
    });

    // Listeners
    document.getElementById("searchInput").addEventListener("input", () => renderVideos(allVideos));
    document.getElementById("eventFilter").addEventListener("change", () => renderVideos(allVideos));
    document.getElementById("sortBy").addEventListener("change", () => renderVideos(allVideos));

    loadVideos();
  </script>
</body>
</html>
